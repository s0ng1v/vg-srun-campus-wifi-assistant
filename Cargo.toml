[workspace]
resolver = "2"
members = [
    "crates/srun-core",
    "crates/srun-ipc",
    "crates/srun-daemon",
    "crates/srun-notifier",
    "crates/srun-setup",
    "src-tauri",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/v1gn0s/srun-campus-wifi-assistant"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

